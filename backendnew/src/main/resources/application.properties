spring.application.name=backendnew
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskmanager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:<->}
spring.datasource.password=${DB_PASSWORD:<->}

spring.jpa.hibernate.ddl-auto=update
server.port=8080
# JWT (env var overrides the local default)
app.jwt.secret=${JWT_SECRET:change-me-dev-only-secret-at-least-32-characters-long}
app.jwt.expiration-ms=86400000



