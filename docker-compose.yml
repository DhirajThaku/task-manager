services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: taskmanager
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backendnew
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskmanager
      DB_USERNAME: root
      DB_PASSWORD: root123
      JWT_SECRET: docker-dev-secret-change-me-at-least-32-characters
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./task-manager-ui
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data: